<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>ViralNight</title>
    <meta name="description" content="Poste tes soirées, gagne des points, débloque des récompenses dans ton club." />

    <!-- PWA -->
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="robots" content="noindex" />

    <!-- Polices : Inter (texte/titres) + JetBrains Mono (chiffres, feel data).
         preconnect pour couper la latence, display=swap pour ne pas bloquer le rendu. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <!-- Grain de film, tres discret, pose sur tout l'ecran. -->
    <div class="noise" aria-hidden="true"></div>

    <!-- Le routeur monte chaque ecran ici. -->
    <div id="app" class="app-viewport"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
